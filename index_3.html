<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plan de Choque — GHL Hoteles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'Elms Sans'; src:local('Elms Sans Bold'), local('ElmsSans-Bold'), local('Elms Sans'); font-weight:700; }
  @font-face { font-family:'Elms Sans'; src:local('Elms Sans Semibold'), local('ElmsSans-Semibold'), local('Elms Sans SemiBold'); font-weight:600; }
  @font-face { font-family:'Elms Sans'; src:local('Elms Sans Regular'), local('ElmsSans-Regular'), local('Elms Sans'); font-weight:400; }

  :root{
    --navy:#023859;
    --deepsea:#2A5E95;
    --bloodblue:#6399BA;
    --gray:#808080;
    --lightgray:#D1D1D1;
    --bg:#FFFFFF;
    --panel:#FAFBFC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Elms Sans','Inter','Segoe UI',Arial,sans-serif;
    font-weight:400;
    background:var(--panel);
    color:#1c2b36;
    line-height:1.5;
  }

  .header{
    background:linear-gradient(135deg, var(--navy) 0%, var(--deepsea) 100%);
    color:#fff;
    padding:38px 56px 0;
  }
  .header-top-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;
  }
  .header-top-row .title-block{ flex:1; min-width:240px; }
  .hotel-count-badge{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.22);
    padding:10px 18px; border-radius:24px; white-space:nowrap; margin-top:2px;
  }
  .hotel-count-badge .count-num{ font-size:22px; font-weight:600; color:#fff; line-height:1; }
  .hotel-count-badge .count-label{ font-size:11.5px; color:var(--bloodblue); text-transform:uppercase; letter-spacing:1px; font-weight:700; line-height:1.3; }
  .header .eyebrow{
    font-size:12.5px; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--bloodblue); font-weight:600; margin-bottom:10px;
  }
  .header h1{ font-size:32px; font-weight:600; letter-spacing:0.2px; }
  .header .sub{ margin-top:6px; font-size:15px; color:#cfe0ee; font-weight:400; padding-bottom:20px;}

  .main-tabs{
    display:flex; gap:4px; padding-top:6px;
  }
  .main-tab{
    padding:12px 24px; font-size:13.5px; font-weight:700; color:#cfe0ee;
    background:rgba(255,255,255,0.08); border-radius:8px 8px 0 0; cursor:pointer;
  }
  .main-tab:hover{ background:rgba(255,255,255,0.16); }
  .main-tab.active{ background:var(--panel); color:var(--navy); }

  .subheader-bar{
    background:linear-gradient(135deg, var(--navy) 0%, var(--deepsea) 100%);
    padding:20px 56px 24px;
  }
  .hotel-search-wrap{ margin:0 0 16px; }
  .hotel-search-input{
    width:100%; max-width:340px; padding:10px 16px; border-radius:8px; border:none;
    font-family:inherit; font-size:13.5px; font-weight:400; color:#12232f;
    background:#fff;
  }
  .hotel-search-input::placeholder{ color:var(--gray); }
  .subheader-bar .hotel-tabs{ padding:0; margin:0; }

  /* ===== RESUMEN VIEW ===== */
  .resumen-content{ max-width:1180px; margin:0 auto; padding:36px 56px 70px; }
  .resumen-section-title{
    font-size:18px; font-weight:600; color:var(--navy); margin:0 0 16px;
    display:flex; align-items:center; gap:10px;
  }
  .global-kpi-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:44px;
  }
  .global-kpi-card{
    background:#fff; border-radius:10px; padding:20px 22px;
    box-shadow:0 4px 16px rgba(2,56,89,0.08); border-top:4px solid var(--deepsea);
  }
  .global-kpi-card .g-label{ font-size:12px; text-transform:uppercase; letter-spacing:1.3px; color:var(--gray); font-weight:600; }
  .global-kpi-card .g-value{ font-size:32px; font-weight:600; color:var(--navy); margin-top:8px; }

  .area-global-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:44px;
  }

  .pending-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:44px; }
  .pending-row{
    display:flex; align-items:center; gap:16px;
    background:#fff; border:1px solid var(--lightgray); border-radius:10px;
    padding:16px 20px; cursor:pointer; transition:border-color 0.15s;
  }
  .pending-row:hover{ border-color:var(--bloodblue); }
  .pending-row .p-rank{
    width:26px; height:26px; border-radius:50%; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex-shrink:0;
  }
  .pending-row .p-main{ flex:1; min-width:0; }
  .pending-row .p-name{ font-size:14.5px; font-weight:600; color:#12232f; }
  .pending-row .p-meta{ font-size:12px; color:var(--gray); margin-top:2px; }
  .pending-row .p-count{
    background:#F0F2F4; color:var(--navy); border:1.5px solid var(--bloodblue);
    padding:5px 14px; border-radius:20px; font-size:12.5px; font-weight:700; white-space:nowrap;
  }

  .hotel-grid-table{
    width:100%; border-collapse:separate; border-spacing:0 8px;
  }
  .hotel-grid-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--gray); font-weight:600; padding:0 16px 6px;
  }
  .hotel-grid-table td{
    background:#fff; padding:14px 16px; font-size:13.5px; color:#22323d;
    border-top:1px solid var(--lightgray); border-bottom:1px solid var(--lightgray);
  }
  .hotel-grid-table tr{ cursor:pointer; }
  .hotel-grid-table td:first-child{ border-left:1px solid var(--lightgray); border-radius:8px 0 0 8px; font-weight:600; color:var(--navy); }
  .hotel-grid-table td:last-child{ border-right:1px solid var(--lightgray); border-radius:0 8px 8px 0; }
  .hotel-grid-table tr:hover td{ border-color:var(--bloodblue); }
  .mini-bar-bg{ height:8px; background:var(--lightgray); border-radius:4px; overflow:hidden; width:100px; flex-shrink:0; }
  .mini-bar-fill{ display:block; height:100%; background:var(--deepsea); border-radius:4px; }

  .hotel-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0 56px;
  }
  .hotel-tab{
    padding:11px 20px;
    font-size:13.5px;
    font-weight:700;
    color:#cfe0ee;
    background:rgba(255,255,255,0.08);
    border:1.5px solid rgba(255,255,255,0.18);
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .hotel-tab:hover{ background:rgba(255,255,255,0.16); }
  .hotel-tab.active{ background:#fff; color:var(--navy); border-color:#fff; }
  .hotel-tab .llamado-count{
    font-size:10.5px;
    font-weight:700;
    background:rgba(255,255,255,0.18);
    color:#fff;
    padding:1px 7px;
    border-radius:20px;
  }
  .hotel-tab.active .llamado-count{ background:rgba(2,56,89,0.1); color:var(--navy); }
  .hotel-tab.add-hotel{
    color:#cfe0ee; background:transparent;
    border:1px dashed rgba(255,255,255,0.35);
  }

  .llamado-tabs{
    max-width:1180px;
    margin:0 auto;
    padding:20px 56px 0;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .llamado-tab{
    padding:8px 16px;
    font-size:12.5px;
    font-weight:700;
    color:var(--deepsea);
    background:#fff;
    border:1.5px solid var(--lightgray);
    border-radius:6px;
    cursor:pointer;
  }
  .llamado-tab.active{
    background:var(--navy);
    color:#fff;
    border-color:var(--navy);
  }

  .area-bubbles{
    max-width:1180px;
    margin:0 auto;
    padding:18px 56px 0;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .bubble{
    display:flex; align-items:center; gap:9px;
    padding:10px 20px; border-radius:24px;
    font-size:13.5px; font-weight:700; cursor:pointer;
    border:1.5px solid var(--lightgray);
    background:#fff; color:var(--gray);
    transition:all 0.15s;
  }
  .bubble .dot{ width:9px; height:9px; border-radius:50%; background:var(--lightgray); }
  .bubble .count-pill{
    font-size:11px; font-weight:700; background:#eef1f3;
    color:var(--gray); padding:1px 8px; border-radius:20px;
  }
  .bubble.contenido.active{ border-color:var(--navy); color:var(--navy); background:#eaf1f7;}
  .bubble.contenido.active .dot{ background:var(--navy); }
  .bubble.seo.active{ border-color:var(--deepsea); color:var(--deepsea); background:#eaf0f9;}
  .bubble.seo.active .dot{ background:var(--deepsea); }
  .bubble.chatbot.active{ border-color:var(--bloodblue); color:var(--deepsea); background:#eef4f9;}
  .bubble.chatbot.active .dot{ background:var(--bloodblue); }
  .bubble.active .count-pill{ background:rgba(2,56,89,0.08); }

  .summary{
    max-width:1180px; margin:0 auto; padding:22px 56px 0;
    display:grid; grid-template-columns:repeat(3,1fr); gap:20px;
  }
  .kpi-card{
    background:#fff; border-radius:10px; padding:20px 22px;
    box-shadow:0 4px 16px rgba(2,56,89,0.08);
    border-top:4px solid var(--deepsea);
  }
  .kpi-card.contenido{ border-top-color:var(--navy); }
  .kpi-card.seo{ border-top-color:var(--deepsea); }
  .kpi-card.chatbot{ border-top-color:var(--bloodblue); }
  .kpi-card .area-name{ font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--gray); font-weight:600; }
  .kpi-card .count-row{ display:flex; align-items:baseline; gap:8px; margin-top:8px; }
  .kpi-card .count{ font-size:30px; font-weight:600; color:var(--navy); }
  .kpi-card .count-of{ font-size:13px; color:var(--gray); }
  .kpi-card .bar-bg{ height:6px; background:var(--lightgray); border-radius:3px; margin-top:10px; overflow:hidden; }
  .kpi-card .bar-fill{ height:100%; background:var(--deepsea); border-radius:3px; }

  .content{ max-width:1180px; margin:0 auto; padding:30px 56px 70px; }
  .area-panel-heading{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .area-panel-heading h2{ font-size:20px; font-weight:600; color:var(--navy); }
  .area-panel-heading .count-tag{ font-size:12.5px; color:var(--gray); }

  .task-card{
    background:#fff; border:1px solid var(--lightgray); border-radius:10px;
    padding:22px 26px; margin-bottom:16px;
  }
  .task-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .task-title{ font-size:16.5px; font-weight:600; color:#12232f; flex:1; min-width:220px; }
  .badges{ display:flex; gap:8px; flex-wrap:wrap; }
  .badge{ font-size:11px; font-weight:600; padding:4px 11px; border-radius:20px; letter-spacing:0.3px; white-space:nowrap; }
  .badge.esfuerzo-alto{ background:#EAEDF0; color:var(--navy); font-weight:600; }
  .badge.esfuerzo-medio{ background:#EEF1F4; color:var(--deepsea); }
  .badge.esfuerzo-bajo{ background:#F2F3F4; color:var(--gray); }
  .badge.estado-completado{ background:var(--navy); color:#fff; }
  .badge.estado-ajustar{ background:#fff; color:var(--navy); border:1.5px solid var(--bloodblue); }
  .badge.estado-progreso{ background:#EAF1F7; color:var(--deepsea); }
  .badge.estado-espera{ background:var(--lightgray); color:#5a5a5a; }

  .task-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px 28px; margin-top:16px; }
  .field-label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gray); font-weight:600; margin-bottom:4px; }
  .field-value{ font-size:14px; color:#22323d; }

  .date-dep-row{
    display:flex; gap:32px; margin-top:18px; padding-top:16px;
    border-top:1px solid var(--lightgray); flex-wrap:wrap;
  }
  .date-dep-row .field{ min-width:130px; }

  .comment-block{
    margin-top:16px; background:#F4F7FA; border-left:3px solid var(--bloodblue);
    border-radius:0 6px 6px 0; padding:14px 18px;
  }
  .comment-block .field-label{ color:var(--deepsea); }
  .comment-block .field-value{ color:#33434e; font-size:13.5px; line-height:1.6; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--gray); font-size:14px; }

  .footer{
    text-align:center; padding:26px; color:var(--gray); font-size:12px;
    border-top:1px solid var(--lightgray);
  }

  @media (max-width:720px){
    .header{ padding:26px 20px 0; }
    .hotel-tabs{ padding:0 20px; }
    .llamado-tabs{ padding:16px 20px 0; }
    .area-bubbles{ padding:16px 20px 0; }
    .summary{ padding:18px 20px 0; grid-template-columns:1fr; }
    .content{ padding:24px 20px; }
    .task-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="header-top-row">
      <div class="title-block">
        <div class="eyebrow">Comité de Ingresos · Agencia Digital</div>
        <h1>Plan de Choque</h1>
        <div class="sub">Seguimiento por hotel y por llamado — Contenido, SEO y Chatbot</div>
      </div>
      <div class="hotel-count-badge" id="hotelCountBadge"></div>
    </div>
    <div class="main-tabs" id="mainTabs"></div>
  </div>

  <div id="resumenView"></div>

  <div id="porHotelView">
    <div class="subheader-bar">
      <div class="hotel-search-wrap">
        <input type="text" id="hotelSearchInput" class="hotel-search-input" placeholder="Buscar hotel...">
      </div>
      <div class="hotel-tabs" id="hotelTabs"></div>
    </div>
    <div class="llamado-tabs" id="llamadoTabs"></div>
    <div class="area-bubbles" id="areaBubbles"></div>
    <div class="summary" id="summary"></div>
    <div class="content" id="content"></div>
  </div>

  <div class="footer">
    Elaborado por: Agencia Digital · Dirección de Mercadeo · Oficina Central GHL · Julio 2026
  </div>

function getHotel(id){ return HOTELS.find(h=>h.id===id); }
function getLlamado(hotel, id){ return hotel.llamados.find(l=>l.id===id); }

function pctCompletado(tasks){
  if(!tasks.length) return {done:0,total:0,pct:0};
  const done = tasks.filter(t=>t.estado_final==="completado").length;
  return {done, total:tasks.length, pct: Math.round((done/tasks.length)*100)};
}

function normalizeText(s){
  return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function filteredHotelsList(){
  if(!searchQuery.trim()) return HOTELS;
  const q = normalizeText(searchQuery);
  return HOTELS.filter(h => normalizeText(h.name).includes(q));
}

    let hDone=0, hTotal=0;
    ["contenido","seo","chatbot"].forEach(areaKey=>{
      h.llamados.forEach(l=>{
        const tasks = l.areas[areaKey] ? l.areas[areaKey].tasks : [];
        const {done,total} = pctCompletado(tasks);
        areaAgg[areaKey].done += done; areaAgg[areaKey].total += total;
        totalTasks += total; totalDone += done;
      });
      const latestTasks = latest.areas[areaKey] ? latest.areas[areaKey].tasks : [];
      hDone += latestTasks.filter(t=>t.estado_final==="completado").length;
      hTotal += latestTasks.length;
    });
    const pendientes = ["contenido","seo","chatbot"].reduce((acc,areaKey)=>{
      const tasks = latest.areas[areaKey] ? latest.areas[areaKey].tasks : [];
      return acc + tasks.filter(t=>t.estado_final==="ajustar"||t.estado_final==="espera").length;
    },0);
    hotelRows.push({
      id:h.id, name:h.name, latestLabel:latest.label, latestDate:latest.date,
      llamadosCount:h.llamados.length, done:hDone, total:hTotal,
      pct: hTotal? Math.round((hDone/hTotal)*100):0, pendientes, latestLlamadoId:latest.id
    });
  });

  const globalPct = totalTasks ? Math.round((totalDone/totalTasks)*100) : 0;
  const sortedForTable = [...hotelRows].sort((a,b)=> a.name.localeCompare(b.name));

  el.innerHTML = `
    <div class="resumen-content">

      <div class="resumen-section-title">Panorama general</div>
      <div class="global-kpi-grid">
        <div class="global-kpi-card">
          <div class="g-label">Hoteles intervenidos</div>
          <div class="g-value">${HOTELS.length}</div>
        </div>
        <div class="global-kpi-card">
          <div class="g-label">Llamados registrados</div>
          <div class="g-value">${totalLlamados}</div>
        </div>
        <div class="global-kpi-card">
          <div class="g-label">Acciones totales</div>
          <div class="g-value">${totalTasks}</div>
        </div>
        <div class="global-kpi-card">
          <div class="g-label">% completado global</div>
          <div class="g-value">${globalPct}%</div>
        </div>
      </div>

      <div class="resumen-section-title">Avance por área (histórico, todos los llamados)</div>
      <div class="area-global-grid">
        ${Object.keys(AREA_LABELS).map(areaKey=>{
          const a = areaAgg[areaKey];
          const pct = a.total ? Math.round((a.done/a.total)*100) : 0;
          return `
            <div class="kpi-card ${areaKey}">
              <div class="area-name">${AREA_LABELS[areaKey]}</div>
              <div class="count-row"><span class="count">${a.done}</span><span class="count-of">/ ${a.total} completadas</span></div>
              <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;"></div></div>
            </div>
          `;
        }).join("")}
      </div>

      <div class="resumen-section-title">Todos los hoteles</div>
      <table class="hotel-grid-table">
        <thead>
          <tr><th>Hotel</th><th>Llamados</th><th>Último llamado</th><th>Progreso (último llamado)</th></tr>
        </thead>
        <tbody>
          ${sortedForTable.map(h=>`
            <tr onclick="jumpToHotel('${h.id}','${h.latestLlamadoId}')">
              <td>${h.name}</td>
              <td>${h.llamadosCount}</td>
              <td>${h.latestLabel} · ${h.latestDate}</td>
              <td>
                <div style="display:flex; align-items:center; gap:10px;">
                  <div class="mini-bar-bg"><div class="mini-bar-fill" style="width:${h.pct}%;"></div></div>
                  <span style="font-size:12.5px; color:var(--gray); white-space:nowrap;">${h.done}/${h.total} (${h.pct}%)</span>
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>

    </div>
  `;
}

function renderHotelTabs(){
  const el = document.getElementById("hotelTabs");
  const list = filteredHotelsList();
  if(!list.find(h=>h.id===currentHotel) && list.length){
    currentHotel = list[0].id;
    currentLlamado = list[0].llamados[list[0].llamados.length-1].id;
  }
  el.innerHTML = list.map(h => `
    <div class="hotel-tab ${h.id===currentHotel?'active':''}" onclick="selectHotel('${h.id}')">
      ${h.name}
      ${h.llamados.length>1 ? `<span class="llamado-count">${h.llamados.length} llamados</span>` : ``}
    </div>
  `).join("") || `<div class="empty-state" style="color:#cfe0ee;">Sin resultados para "${searchQuery}"</div>`;
}

function renderLlamadoTabs(hotel){
  const el = document.getElementById("llamadoTabs");
  el.innerHTML = hotel.llamados.map(l => `
    <div class="llamado-tab ${l.id===currentLlamado?'active':''}" onclick="selectLlamado('${l.id}')">${l.label} · ${l.date}</div>
  `).join("");
}

function renderBubbles(llamado){
  const el = document.getElementById("areaBubbles");
  el.innerHTML = Object.keys(AREA_LABELS).map(areaKey=>{
    const tasks = llamado.areas[areaKey] ? llamado.areas[areaKey].tasks : [];
    const {done,total} = pctCompletado(tasks);
    return `
      <div class="bubble ${areaKey} ${areaKey===currentArea?'active':''}" onclick="selectArea('${areaKey}')">
        <span class="dot"></span>${AREA_LABELS[areaKey]}
        <span class="count-pill">${done}/${total}</span>
      </div>
    `;
  }).join("");
}

function renderSummary(llamado){
  const el = document.getElementById("summary");
  el.innerHTML = Object.keys(AREA_LABELS).map(areaKey=>{
    const tasks = llamado.areas[areaKey] ? llamado.areas[areaKey].tasks : [];
    const {done,total,pct} = pctCompletado(tasks);
    return `
      <div class="kpi-card ${areaKey}">
        <div class="area-name">${AREA_LABELS[areaKey]}</div>
        <div class="count-row"><span class="count">${done}</span><span class="count-of">/ ${total} completadas</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;"></div></div>
      </div>
    `;
  }).join("");
}

function badgeEstado(estado){
  const map = { completado:"estado-completado", ajustar:"estado-ajustar", progreso:"estado-progreso", espera:"estado-espera" };
  return `<span class="badge ${map[estado]||''}">${ESTADO_LABEL[estado]||estado}</span>`;
}

function renderTaskCard(t){
  return `
    <div class="task-card">
      <div class="task-top">
        <div class="task-title">${t.title}</div>
        <div class="badges">
          <span class="badge esfuerzo-${t.esfuerzo}">${ESFUERZO_LABEL[t.esfuerzo]}</span>
          ${badgeEstado(t.estado_final)}
        </div>
      </div>
      <div class="task-grid">
        <div><div class="field-label">Estado actual</div><div class="field-value">${t.estado_actual}</div></div>
        <div><div class="field-label">Ajuste a realizar</div><div class="field-value">${t.ajuste}</div></div>
      </div>
      <div class="date-dep-row">
        <div class="field"><div class="field-label">Fecha inicio</div><div class="field-value">${t.inicio}</div></div>
        <div class="field"><div class="field-label">Fecha fin</div><div class="field-value">${t.fin}</div></div>
        <div class="field"><div class="field-label">Dependencia</div><div class="field-value">${t.dependencia}</div></div>
      </div>
      ${t.comentario ? `
      <div class="comment-block">
        <div class="field-label">Comentario</div>
        <div class="field-value">${t.comentario}</div>
      </div>` : ``}
    </div>
  `;
}

function renderContent(llamado){
  const el = document.getElementById("content");
  const area = llamado.areas[currentArea];
  if(!area || !area.tasks.length){
    el.innerHTML = `<div class="empty-state">Aún no hay acciones registradas en esta área para este llamado.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="area-panel-heading">
      <h2>${AREA_LABELS[currentArea]}</h2>
      <span class="count-tag">· ${area.tasks.length} acciones · Responsable: ${area.responsable}</span>
    </div>
    ${area.tasks.map(renderTaskCard).join("")}
  `;
}

function renderAll(){
  const hotel = getHotel(currentHotel);
  const llamado = getLlamado(hotel, currentLlamado);
  renderHotelTabs();
  renderLlamadoTabs(hotel);
  renderBubbles(llamado);
  renderSummary(llamado);
  renderContent(llamado);
}

function selectHotel(id){
  currentHotel = id;
  currentLlamado = getHotel(id).llamados[0].id;
  currentArea = "contenido";
  renderAll();
}
function selectLlamado(id){
  currentLlamado = id;
  currentArea = "contenido";
  renderAll();
}
function selectArea(areaKey){
  currentArea = areaKey;
  renderAll();
}

document.getElementById("hotelSearchInput").addEventListener("input", (e)=>{
  searchQuery = e.target.value;
  renderHotelTabs();
});

renderHotelCountBadge();
renderMainTabs();
document.getElementById("resumenView").style.display = "block";
document.getElementById("porHotelView").style.display = "none";
renderResumen();
renderAll();
</script>

</body>
</html>
